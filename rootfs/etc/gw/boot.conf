# gw-boot-confirm configuration.

# Require /sbin/gw-init status to report overall=secure before confirming an
# update. Keep this at 0 only during the initial audit rollout.
GW_REQUIRE_SECURE=1

# uboot | rauc | swupdate | command | none
GW_UPDATE_BACKEND=uboot

# For A/B U-Boot setups, set the active slot from /proc/cmdline or your update
# agent, for example GW_ACTIVE_SLOT=a. The confirm script writes slot_a_ok=1.
# GW_ACTIVE_SLOT=

# Product health check. Prefer a command that verifies acquisition, storage
# and southbound/broker connectivity without requiring a customer server.
# GW_HEALTH_COMMAND="/usr/bin/gw-health-check --quiet"

# Override backend transaction if needed:
# GW_UPDATE_BACKEND=command
# GW_CONFIRM_COMMAND="/usr/bin/swupdate-confirm"
